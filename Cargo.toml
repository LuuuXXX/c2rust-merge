[package]
name = "c2rust-merge"
version = "0.1.0"
edition = "2021"
description = "A tool to merge C-to-Rust translated code into an existing Rust project"
license = "MIT OR Apache-2.0"

[[bin]]
name = "c2rust-merge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
